<!DOCTYPE html>
<html>

<head>

    <title>Student Marks Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Student Marks Management System</h1>

    <div class="container">

        <h2>Add Student</h2>

        <label>Roll Number</label>
        <input type="number" id="rollNo">

        <label>Student Name</label>
        <input type="text" id="studentName">

        <label>Java Marks</label>
        <input type="number" id="java">

        <label>Python Marks</label>
        <input type="number" id="python">

        <label>Maths Marks</label>
        <input type="number" id="maths">

        <label>English Marks</label>
        <input type="number" id="english">

        <label>DBMS Marks</label>
        <input type="number" id="dbms">

        <button onclick="addStudent()">Add Student</button>

    </div>


    <div class="container">

        <h2>Student Records</h2>

        <table>

            <thead>

                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Total</th>
                    <th>Average</th>
                    <th>Grade</th>
                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>


    <div class="container">

        <h2>Class Statistics</h2>

        <p>
            Total Students:
            <span id="totalStudents">0</span>
        </p>

        <p>
            Class Average:
            <span id="classAverage">0</span>
        </p>

        <p>
            Class Topper:
            <span id="topper">None</span>
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
